name: Playwright API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore PlaywrightProject.Tests/PlaywrightProject.Tests.csproj

    - name: Build
      run: dotnet build PlaywrightProject.Tests/PlaywrightProject.Tests.csproj

    - name: Run tests
      run: dotnet test PlaywrightProject.Tests/PlaywrightProject.Tests.csproj --logger "trx;LogFileName=TestResults.trx"

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: '**/TestResults/*.trx'
        reporter: dotnet-trx
